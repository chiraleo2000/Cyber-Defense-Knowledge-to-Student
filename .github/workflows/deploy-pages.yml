# เผยแพร่เว็บไซต์ (โฟลเดอร์ docs/) ขึ้น GitHub Pages ผ่าน GitHub Actions
# ต้องตั้ง Settings -> Pages -> Source = "GitHub Actions" (คุณเปิดไว้แล้วตอนเพิ่ม workflow ผ่าน UI)
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # เผยแพร่เฉพาะโฟลเดอร์ docs/ (เว็บไซต์อยู่ในนี้ ไม่ใช่รากทั้ง repo)
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
