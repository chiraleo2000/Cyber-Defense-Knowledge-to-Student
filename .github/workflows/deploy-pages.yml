# เผยแพร่เว็บไซต์ (โฟลเดอร์ docs/) ขึ้น GitHub Pages ผ่านสาขา gh-pages
#
# วิธีเปิดใช้งาน (ทำครั้งเดียว): repo -> Settings -> Pages ->
#   Build and deployment -> Source = "Deploy from a branch"
#   Branch = gh-pages , Folder = / (root) -> Save
#
# workflow นี้ push เนื้อหา docs/ ไปยังสาขา gh-pages ทุกครั้งที่แก้ไขบน main
# (ไม่เรียก Pages REST API จึงไม่เจอ error "Get Pages site failed / Not Found")
name: Deploy site to gh-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish docs/ to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          clean: true
