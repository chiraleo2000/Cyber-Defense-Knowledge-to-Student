# เผยแพร่เว็บไซต์ (โฟลเดอร์ docs/) ขึ้น GitHub Pages ผ่านสาขา gh-pages
# วิธีนี้ไม่เรียก Pages REST API (actions/configure-pages) จึงไม่เจอ error "Get Pages site failed / Not Found"
# แต่ใช้การ push ไฟล์ไปยังสาขา gh-pages ตรง ๆ ซึ่งทำงานได้เสมอ
name: Deploy site to gh-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish docs/ to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          clean: true
