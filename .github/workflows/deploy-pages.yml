name: Deploy static site to GitHub Pages

# เผยแพร่เนื้อหาในโฟลเดอร์ docs/ ขึ้น GitHub Pages โดยอัตโนมัติ
# ทุกครั้งที่มีการ push เข้าสาขา main (หรือกดรันเองจากแท็บ Actions)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

# สิทธิ์ที่จำเป็นสำหรับการ deploy ขึ้น Pages
permissions:
  contents: read
  pages: write
  id-token: write

# ให้รันทีละงาน ไม่ยกเลิกงานที่กำลัง deploy ค้างอยู่
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # เปิดใช้งาน Pages ให้อัตโนมัติถ้ายังไม่ได้เปิด (ไม่ต้องไปตั้งใน Settings เอง)
          enablement: true

      - name: Upload docs/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
