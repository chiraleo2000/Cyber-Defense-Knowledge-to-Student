name = "check-kon-oon-agent-proxy"
main = "src/index.js"
compatibility_date = "2024-09-01"

# ตัวแปรที่ไม่ใช่ความลับ ตั้งค่าตรงนี้ได้เลย (แก้ไขแล้ว deploy ใหม่)
[vars]
# Origin ของเว็บที่อนุญาตให้เรียก worker จากเบราว์เซอร์ (CORS)
# ใส่ได้หลายค่า คั่นด้วยจุลภาค เช่น "https://chiraleo2000.github.io,http://localhost:5500"
# (path /Cyber-Defense-Knowledge-to-Student ไม่ใช่ส่วนของ Origin — อย่าใส่ต่อท้าย)
ALLOWED_ORIGIN = "https://chiraleo2000.github.io"

# ชื่อโมเดล Pathumma (ThaiLLM ของ NECTEC) ที่จะส่งไปยัง upstream
# ค่า default นี้คือโมเดลของ ThaiLLM Playground (thaillm.or.th)
# - ThaiLLM Playground:  "pathumma-thaillm-qwen3-8b-think-3.0.0"
# - ผู้ให้บริการอื่น/self-host: เปลี่ยนเป็นชื่อโมเดลตามที่บริการนั้นกำหนด
MODEL_NAME = "pathumma-thaillm-qwen3-8b-think-3.0.0"

# ----------------------------------------------------------------------------
# ค่าที่เป็นความลับ (API key, upstream URL) ห้ามใส่ในไฟล์นี้ (จะรั่วถาวรใน git)
# ให้ตั้งผ่านบรรทัดคำสั่งแทน (ดูวิธีทำใน worker/README.md หรือ AGENT-SETUP.md):
#
#   wrangler secret put UPSTREAM_API_KEY     # API key ของ ThaiLLM Playground
#   wrangler secret put UPSTREAM_BASE_URL    # ไม่ต้องมี /chat/completions ต่อท้าย
#
# ตัวอย่าง UPSTREAM_BASE_URL:
#   - ThaiLLM Playground (แนะนำ):   http://thaillm.or.th/api/v1
#   - self-host เองด้วย vLLM/Ollama: https://your-server.example.com/v1
# ----------------------------------------------------------------------------
